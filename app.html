<!DOCTYPE html>
<!-- app.html — main application (protected) -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAH Academy — Suivi des paiements</title>
  <script>try{if(localStorage.getItem('slah_theme')==='dark')document.documentElement.classList.add('dark-mode')}catch(e){}</script>
  <script>try{if(localStorage.getItem('slah_nav_pinned')!=='0')document.documentElement.classList.add('nav-pinned')}catch(e){}</script>
  <meta name="description" content="SLAH Academy — suivi des paiements mensuels des élèves.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/db.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Chargement…</div>
  </div>

  <button id="navToggle" class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <div class="app-shell">
    <nav class="icon-rail" id="iconRail" aria-label="Navigation rapide">
      <div class="rail-logo" title="SLAH Academy">S</div>
      <button type="button" class="rail-item" data-rail-view="dashboard" data-tip="Tableau de bord">🏠</button>
      <div class="rail-sep"></div>
      <div class="rail-levels" id="railLevels"></div>
      <div class="rail-spacer"></div>
      <button type="button" class="rail-item" data-rail-logout data-tip="Se déconnecter">⎋</button>
    </nav>

    <button type="button" id="railExpandHint" class="rail-expand-hint" title="Ouvrir le menu" aria-label="Ouvrir le menu">»</button>

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">SLAH Academy</div>
        <span class="year-wrap">
          <button type="button" class="annee-badge" id="anneeBadge" title="Changer d'année scolaire">2026–2027</button>
          <div class="year-menu" id="anneeMenu" hidden></div>
        </span>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Basculer clair/sombre"></button>
        <button type="button" id="navPinBtn" class="nav-pin-btn" title="Épingler / détacher le menu (Ctrl+B)">❮</button>
      </div>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="sidebar-bottom">
        <div class="user-email" id="userEmail"></div>
        <button class="btn-logout" id="logoutBtn">Se déconnecter</button>
      </div>
    </aside>

    <main class="main" id="mainContent"></main>
  </div>

  <script>
    (function () {
      const btn = document.getElementById('themeToggle');
      if (!btn) return;
      const MOON = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      const SUN = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
      const isDark = () => document.documentElement.classList.contains('dark-mode');
      const paint = () => {
        btn.innerHTML = isDark() ? SUN : MOON;
        btn.title = isDark() ? 'Mode clair' : 'Mode sombre';
      };
      paint();
      btn.addEventListener('click', () => {
        const dark = document.documentElement.classList.toggle('dark-mode');
        try { localStorage.setItem('slah_theme', dark ? 'dark' : 'light'); } catch (e) {}
        paint();
      });
    })();
  </script>
</body>
</html>
