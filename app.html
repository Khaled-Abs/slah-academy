<!DOCTYPE html>
<!-- app.html — main application (protected) -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLAH Academy — Suivi des paiements</title>
  <script>try{if(localStorage.getItem('slah_nav_pinned')!=='0')document.documentElement.classList.add('nav-pinned')}catch(e){}</script>
  <meta name="description" content="SLAH Academy — suivi des paiements mensuels des élèves.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/db.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Chargement…</div>
  </div>

  <button id="navToggle" class="nav-toggle" aria-label="Ouvrir le menu">☰</button>
  <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>

  <div class="app-shell">
    <nav class="icon-rail" id="iconRail" aria-label="Navigation rapide">
      <div class="rail-logo" title="SLAH Academy">S</div>
      <button type="button" class="rail-item" data-rail-view="dashboard" data-tip="Tableau de bord">🏠</button>
      <div class="rail-sep"></div>
      <div class="rail-levels" id="railLevels"></div>
      <div class="rail-spacer"></div>
      <button type="button" class="rail-item" data-rail-logout data-tip="Se déconnecter">⎋</button>
    </nav>

    <button type="button" id="railExpandHint" class="rail-expand-hint" title="Ouvrir le menu" aria-label="Ouvrir le menu">«</button>

    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-logo">SLAH Academy</div>
        <span class="year-wrap">
          <button type="button" class="annee-badge" id="anneeBadge" title="Changer d'année scolaire">2026–2027</button>
          <div class="year-menu" id="anneeMenu" hidden></div>
        </span>
        <button type="button" id="navPinBtn" class="nav-pin-btn" title="Épingler / détacher le menu (Ctrl+B)">❮</button>
      </div>

      <nav class="side-nav" id="sideNav"></nav>

      <div class="sidebar-bottom">
        <div class="user-email" id="userEmail"></div>
        <button class="btn-logout" id="logoutBtn">Se déconnecter</button>
      </div>
    </aside>

    <main class="main" id="mainContent"></main>
  </div>
</body>
</html>
