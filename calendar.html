<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Séances hebdomadaires — SLAH Academy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:              #F6F7FB;
      --surface:         #FFFFFF;
      --surface-sunken:  #F0F1F6;
      --border:          #E7E8F0;
      --border-mid:      #D8DAE6;
      --ink-1:           #14151A;
      --ink-2:           #63636F;
      --ink-3:           #9C9CAA;
      --accent:          #5B5FEF;
      --accent-hover:    #4A4EDB;
      --accent-soft:     #EEEEFD;
      --accent-ring:     rgba(91,95,239,0.35);
      --mint:            #17B26A;
      --coral:           #FF6B6B;
      --amber:           #F7A93A;
      --shadow-sm:    0 2px 8px rgba(20,21,26,0.06);
      --shadow-card:  0 1px 3px rgba(20,21,26,0.05), 0 12px 32px rgba(20,21,26,0.06);
      --shadow-md:    0 8px 24px rgba(20,21,26,0.10);
      --shadow-lg:    0 20px 56px rgba(20,21,26,0.16);
      --radius-sm:   10px;
      --radius-lg:   20px;
      --radius-xl:   24px;
      --radius-full: 999px;
      --font-display: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-body:    'Inter', -apple-system, sans-serif;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink-1);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: var(--font-body); cursor: pointer; color: inherit; }
    input { font-family: var(--font-body); }
    a { text-decoration: none; }

    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-full);
      padding: 9px 18px;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out);
    }
    .back-link:hover { background: var(--surface-sunken); color: var(--ink-1); }
    .add-event-form {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 480px;
    }
    .add-event-form input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      background: var(--surface-sunken);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 13px;
      color: var(--ink-1);
      outline: none;
      min-width: 140px;
      transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out),
                  box-shadow 160ms var(--ease-out);
    }
    .add-event-form input:focus {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: var(--accent-ring) 0 0 0 4px;
    }
    .btn-blue {
      height: 40px;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: background-color 160ms var(--ease-out), transform 160ms var(--ease-out),
                  box-shadow 160ms var(--ease-out);
    }
    .btn-blue:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    #calendar {
      max-width: 1200px;
      margin: 14px auto 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-card);
      padding: 14px;
    }
    .loading-note {
      max-width: 1200px;
      margin: 0 auto;
      color: var(--ink-3);
      font-size: 12px;
      font-weight: 500;
      padding: 0 4px 8px;
      min-height: 18px;
    }

    /* ---- FullCalendar light theming ---- */
    .fc { font-size: 13px; }
    .fc-theme-standard td,
    .fc-theme-standard th { border-color: var(--border); }
    .fc-theme-standard .fc-scrollgrid {
      border-color: var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .fc-toolbar-title {
      font-family: var(--font-display);
      font-size: 18px !important;
      font-weight: 700 !important;
      color: var(--ink-1);
    }
    .fc-col-header-cell-cushion {
      font-family: var(--font-body);
      color: var(--ink-3);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .fc-daygrid-day-number {
      font-family: var(--font-body);
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 600;
    }
    .fc-timegrid-slot-label-cushion {
      color: var(--ink-3);
      font-family: var(--font-body);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .fc-timegrid-slot-minor {
      border-top-style: dashed;
      border-color: var(--border);
      opacity: 0.6;
    }
    .fc-day-today { background: var(--accent-soft) !important; }
    .fc-highlight { background: var(--accent-soft); opacity: 0.7; }
    .fc-timegrid-now-indicator-line { border-color: var(--coral); border-width: 2px 0 0; }
    .fc-timegrid-now-indicator-arrow { border-color: var(--coral); }

    .fc .fc-button {
      background: var(--surface-sunken);
      border: none;
      border-radius: var(--radius-full);
      color: var(--ink-2);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
      box-shadow: none !important;
      padding: 8px 14px;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out);
    }
    .fc .fc-button:hover { background: var(--border-mid); color: var(--ink-1); }
    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled).fc-button-active:hover {
      background: var(--accent);
      color: #fff;
    }
    .fc .fc-button:disabled { opacity: 0.45; }

    .fc-event {
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      border-width: 0;
      padding: 1px 0;
      cursor: pointer;
    }
    .fc-v-event .fc-event-main { padding: 2px 4px; }
    .fc-event-title { font-weight: 500; }

    /* ---- Éditeur de séance ---- */
    .event-editor {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: min(380px, calc(100vw - 32px));
      background: var(--surface);
      border: none;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .event-editor[hidden] { display: none; }
    .editor-title-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-3);
    }
    .event-editor input {
      height: 40px;
      padding: 0 12px;
      background: var(--surface-sunken);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--ink-1);
      outline: none;
      width: 100%;
      transition: background-color 160ms var(--ease-out), border-color 160ms var(--ease-out),
                  box-shadow 160ms var(--ease-out);
    }
    .event-editor input:focus {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: var(--accent-ring) 0 0 0 4px;
    }
    .editor-start {
      font-size: 12px;
      color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .palette-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-3);
    }
    .palette { display: flex; gap: 8px; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      opacity: 0.85;
      transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out),
                  box-shadow 160ms var(--ease-out);
    }
    .swatch:hover { transform: scale(1.12); opacity: 1; }
    .swatch.sel {
      opacity: 1;
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-1);
    }
    .editor-error { font-size: 12px; color: var(--coral); }
    .editor-actions { display: flex; gap: 8px; align-items: center; }
    .editor-actions button {
      border: none;
      font-weight: 600;
      transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out),
                  transform 160ms var(--ease-out);
    }
    #editorSave {
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 13px;
      box-shadow: var(--shadow-sm);
    }
    #editorSave:hover { background: var(--accent-hover); transform: translateY(-1px); }
    #editorSave:disabled { opacity: 0.55; cursor: not-allowed; }
    #editorDelete {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--coral-soft);
      color: var(--coral);
      font-size: 14px;
    }
    #editorDelete:hover { background: #FFD9D9; }
    #editorCancel {
      background: transparent;
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-full);
      padding: 8px 16px;
      font-size: 13px;
      color: var(--ink-2);
      margin-left: auto;
    }
    #editorCancel:hover { background: var(--surface-sunken); color: var(--ink-1); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      color: var(--ink-1);
      padding: 10px 14px 10px 30px;
      font-size: 13px;
      opacity: 0;
      transform: translateX(20px);
      transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
      pointer-events: none;
    }
    .toast::before {
      content: '';
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--mint);
    }
    .toast.show { opacity: 1; transform: none; }
    .toast.error { color: var(--coral); }
    .toast.error::before { background: var(--coral); }

    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: stretch; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="app.html">← Tableau de bord</a>
    <div class="add-event-form">
      <input type="text" id="quickTitle" placeholder="Titre de la séance (aujourd'hui)" />
      <button class="btn-blue" onclick="quickAdd()">Ajouter</button>
    </div>
  </div>
  <div class="loading-note" id="loadingNote">Chargement des séances…</div>

  <div class="event-editor" id="eventEditor" hidden>
    <span class="editor-title-label" id="editorLabel">Nouvelle séance</span>
    <input type="text" id="editorTitle" placeholder="Titre de la séance" autocomplete="off" />
    <div class="editor-start" id="editorStart"></div>
    <span class="palette-label">Étiquette couleur</span>
    <div class="palette" id="palette"></div>
    <div class="editor-error" id="editorError" hidden></div>
    <div class="editor-actions">
      <button type="button" id="editorSave">Enregistrer</button>
      <button type="button" id="editorDelete" hidden>Supprimer</button>
      <button type="button" id="editorCancel">Annuler</button>
    </div>
  </div>

  <div id="calendar"></div>
  <div class="toast" id="toast"></div>

  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@5.10.1/main.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/db.js"></script>
  <script>
    let calendar = null;
    let editingId = null;
    let pendingStart = null;
    let selectedCouleur = '#4C8DFF';

    const PALETTE = [
      { hex: '#4C8DFF', nom: 'Séance' },
      { hex: '#17B26A', nom: 'Vert' },
      { hex: '#FF6B6B', nom: 'Rouge' },
      { hex: '#F7A93A', nom: 'Ambre' },
      { hex: '#B15CFF', nom: 'Violet' },
      { hex: '#12B8B0', nom: 'Turquoise' }
    ];
    const DEFAULT_COULEUR = '#4C8DFF';

    const editorEl = document.getElementById('eventEditor');
    const editorTitle = document.getElementById('editorTitle');
    const editorStart = document.getElementById('editorStart');
    const editorError = document.getElementById('editorError');
    const editorDelete = document.getElementById('editorDelete');
    const editorLabel = document.getElementById('editorLabel');
    const paletteEl = document.getElementById('palette');

    function showToast(message, type) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.className = 'toast show' + (type === 'error' ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function eventTextColor(hex) {
      return hex.toUpperCase() === '#F7A93A' ? '#14151A' : '#FFFFFF';
    }

    function buildPalette() {
      paletteEl.innerHTML = PALETTE.map((c) =>
        `<button type="button" class="swatch${c.hex === selectedCouleur ? ' sel' : ''}" data-hex="${c.hex}" title="${c.nom}" style="background:${c.hex}"></button>`
      ).join('');
    }

    paletteEl.addEventListener('click', (e) => {
      const sw = e.target.closest('.swatch');
      if (!sw) return;
      selectedCouleur = sw.dataset.hex;
      buildPalette();
    });

    function fmtDate(value) {
      try {
        return new Date(value).toLocaleString('fr-FR', {
          weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
        });
      } catch (e) { return String(value); }
    }

    function openEditor(options) {
      editingId = options.id || null;
      pendingStart = options.start || null;
      selectedCouleur = options.couleur || DEFAULT_COULEUR;
      buildPalette();
      editorTitle.value = options.title || '';
      editorLabel.textContent = options.id ? 'Modifier la séance' : 'Nouvelle séance';
      editorStart.textContent = options.start ? 'Début : ' + fmtDate(options.start) : '';
      editorError.hidden = true;
      editorDelete.hidden = !options.id;
      editorEl.hidden = false;
      editorTitle.focus();
    }

    function closeEditor() {
      editorEl.hidden = true;
      editingId = null;
      pendingStart = null;
    }

    function isAuthRedirect(error) {
      return !!(error && error.redirecting);
    }

    async function refreshEvents() {
      const note = document.getElementById('loadingNote');
      try {
        const rows = await getSessions();
        if (!calendar) return;
        calendar.removeAllEvents();
        rows.forEach((r) => calendar.addEvent(toFcEvent(r)));
        note.textContent = rows.length ? '' : 'Aucune séance enregistrée — cliquez sur le planning pour en créer une.';
      } catch (error) {
        console.error(error);
        note.textContent = '';
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur lors du chargement.', 'error');
      }
    }

    function toFcEvent(row) {
      const c = row.couleur || DEFAULT_COULEUR;
      return {
        id: row.id,
        title: row.titre,
        start: row.debut,
        end: row.fin,
        backgroundColor: c,
        borderColor: c,
        textColor: eventTextColor(c)
      };
    }

    function handleDateClick(info) {
      openEditor({ start: info.dateStr });
    }

    function handleEventClick(info) {
      openEditor({
        id: info.event.id,
        title: info.event.title,
        start: info.event.start ? info.event.start.toISOString() : null,
        couleur: info.event.backgroundColor
      });
    }

    async function handleEventDrop(info) { await persistTiming(info); }
    async function handleEventResize(info) { await persistTiming(info); }

    async function persistTiming(info) {
      try {
        await updateSession(info.event.id, {
          debut: info.event.start.toISOString(),
          fin: info.event.end ? info.event.end.toISOString() : null
        });
        showToast('Horaires mis à jour.', 'ok');
      } catch (error) {
        console.error(error);
        info.revert();
        if (!isAuthRedirect(error)) showToast('Erreur — horaires non enregistrés.', 'error');
      }
    }

    async function saveEditor() {
      const titre = editorTitle.value.trim();
      if (!titre) {
        editorError.textContent = 'Le titre est obligatoire.';
        editorError.hidden = false;
        return;
      }

      const saveBtn = document.getElementById('editorSave');
      saveBtn.disabled = true;

      try {
        if (editingId) {
          await updateSession(editingId, { titre, couleur: selectedCouleur });
          const ev = calendar.getEventById(editingId);
          if (ev) {
            ev.setProp('title', titre);
            ev.setProp('backgroundColor', selectedCouleur);
            ev.setProp('borderColor', selectedCouleur);
            ev.setProp('textColor', eventTextColor(selectedCouleur));
          }
          showToast('Séance modifiée.', 'ok');
        } else {
          let debutIso = pendingStart;
          if (debutIso && /^\d{4}-\d{2}-\d{2}$/.test(debutIso)) debutIso += 'T08:00:00';
          if (!debutIso) debutIso = new Date().toISOString();
          const debut = new Date(debutIso);
          const fin = new Date(debut.getTime() + 60 * 60 * 1000).toISOString();
          const row = await addSession({ titre, debut: debut.toISOString(), fin, couleur: selectedCouleur });
          calendar.addEvent(toFcEvent(row));
          document.getElementById('loadingNote').textContent = '';
          showToast('Séance ajoutée.', 'ok');
        }
        closeEditor();
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteEditing() {
      if (!editingId) return;
      const id = editingId;
      try {
        await deleteSessionRow(id);
        const ev = calendar.getEventById(id);
        if (ev) ev.remove();
        closeEditor();
        showToast('Séance supprimée.', 'ok');
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      }
    }

    async function quickAdd() {
      const input = document.getElementById('quickTitle');
      const titre = input.value.trim();
      if (!titre) { input.focus(); return; }
      try {
        const now = new Date();
        now.setMinutes(0, 0, 0);
        const fin = new Date(now.getTime() + 60 * 60 * 1000).toISOString();
        const row = await addSession({ titre, debut: now.toISOString(), fin, couleur: DEFAULT_COULEUR });
        calendar.addEvent(toFcEvent(row));
        document.getElementById('loadingNote').textContent = '';
        input.value = '';
        showToast('Séance ajoutée.', 'ok');
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        initSupabase();
      } catch (error) {
        console.error(error);
        window.location.href = 'index.html';
        return;
      }

      const session = await getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        editable: true,
        locale: 'fr',
        firstDay: 1,
        slotMinTime: '06:00:00',
        slotMaxTime: '22:00:00',
        slotDuration: '00:30:00',
        slotLabelInterval: '01:00',
        slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay,dayGridMonth'
        },
        allDaySlot: false,
        events: [],
        eventClick: handleEventClick,
        dateClick: handleDateClick,
        eventDrop: handleEventDrop,
        eventResize: handleEventResize
      });
      calendar.render();

      document.getElementById('editorSave').addEventListener('click', saveEditor);
      document.getElementById('editorDelete').addEventListener('click', deleteEditing);
      document.getElementById('editorCancel').addEventListener('click', closeEditor);
      editorTitle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEditor();
        if (e.key === 'Escape') closeEditor();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !editorEl.hidden) closeEditor();
      });

      await refreshEvents();
    });
  </script>
</body>
</html>
