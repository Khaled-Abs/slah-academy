<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Séances hebdomadaires — SLAH Academy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0F0F0F;
      --surface: #1A1A1A;
      --surface-2: #222222;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --text-primary: #F0EEE9;
      --text-secondary: #9E9C97;
      --text-tertiary: #5A5855;
      --paye: #4ADE80;
      --impaye: #F87171;
      --partiel: #FBBF24;
      --accent: #3B82F6;
      --retard: #F97316;
      --violet: #A78BFA;
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; color: inherit; }
    input { font-family: inherit; }
    a { text-decoration: none; }

    .topbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .back-link {
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
    }
    .back-link:hover { color: #60A5FA; }
    .add-event-form {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 460px;
    }
    .add-event-form input {
      flex: 1;
      padding: 9px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      min-width: 140px;
    }
    .add-event-form input:focus { border-color: var(--accent); }
    .btn-blue {
      padding: 9px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color 0.12s ease;
    }
    .btn-blue:hover { background: #60A5FA; }

    #calendar {
      max-width: 1200px;
      margin: 14px auto 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
    }
    .loading-note {
      max-width: 1200px;
      margin: 0 auto;
      color: var(--text-tertiary);
      font-size: 12px;
      padding: 0 4px 8px;
      min-height: 18px;
    }

    /* ---- FullCalendar dark theming ---- */
    .fc { font-size: 13px; }
    .fc-theme-standard td,
    .fc-theme-standard th {
      border-color: var(--border);
    }
    .fc-theme-standard .fc-scrollgrid {
      border-color: var(--border);
    }
    .fc-toolbar-title {
      font-size: 17px !important;
      font-weight: 700 !important;
      color: var(--text-primary);
    }
    .fc-col-header-cell-cushion,
    .fc-daygrid-day-number {
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 4px;
    }
    .fc-timegrid-slot-label-cushion {
      color: var(--text-tertiary);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
    }
    .fc-timegrid-slot-minor {
      border-top-style: dotted;
      border-color: rgba(255,255,255,0.04);
    }
    .fc-day-today {
      background: rgba(59, 130, 246, 0.06) !important;
    }
    .fc-highlight { background: rgba(59, 130, 246, 0.12); }
    .fc-timegrid-now-indicator-line {
      border-color: var(--impaye);
      border-width: 2px 0 0;
    }
    .fc-timegrid-now-indicator-arrow { border-color: var(--impaye); }

    .fc .fc-button {
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
      box-shadow: none !important;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .fc .fc-button:hover {
      background: #2a2a2a;
      color: var(--text-primary);
    }
    .fc .fc-button-primary:not(:disabled).fc-button-active,
    .fc .fc-button-primary:not(:disabled).fc-button-active:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .fc .fc-button:disabled { opacity: 0.45; }
    .fc-event {
      border-radius: 6px;
      font-size: 12px;
      border-width: 0;
      padding: 1px 0;
    }
    .fc-v-event .fc-event-main { padding: 2px 4px; }
    .fc-event-title { font-weight: 500; }

    /* ---- Éditeur de séance ---- */
    .event-editor {
      position: fixed;
      top: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: min(380px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .event-editor[hidden] { display: none; }
    .editor-title-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
    }
    .event-editor input {
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }
    .event-editor input:focus { border-color: var(--accent); }
    .editor-start {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    .palette-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-tertiary);
    }
    .palette {
      display: flex;
      gap: 8px;
    }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 2px solid transparent;
      padding: 0;
      opacity: 0.75;
      transition: transform 0.12s ease, opacity 0.12s ease, border-color 0.12s ease;
    }
    .swatch:hover { transform: scale(1.12); opacity: 1; }
    .swatch.sel {
      opacity: 1;
      border-color: var(--text-primary);
      transform: scale(1.08);
    }
    .editor-error { font-size: 12px; color: var(--impaye); }
    .editor-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .editor-actions button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    #editorSave { background: var(--accent); color: #fff; }
    #editorSave:hover { background: #60A5FA; }
    #editorSave:disabled { opacity: 0.55; cursor: not-allowed; }
    #editorDelete {
      background: rgba(248, 113, 113, 0.10);
      border: 1px solid rgba(248, 113, 113, 0.25) !important;
      color: var(--impaye);
    }
    #editorDelete:hover { background: rgba(248, 113, 113, 0.18); }
    #editorCancel {
      background: transparent;
      border: 1px solid var(--border-strong) !important;
      color: var(--text-secondary);
      margin-left: auto;
    }
    #editorCancel:hover { color: var(--text-primary); }

    /* Toast */
    .toast {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.error { color: var(--impaye); }

    @media (max-width: 640px) {
      .topbar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back-link" href="app.html">← Tableau de bord</a>
    <div class="add-event-form">
      <input type="text" id="quickTitle" placeholder="Titre de la séance (aujourd'hui)" />
      <button class="btn-blue" onclick="quickAdd()">Ajouter</button>
    </div>
  </div>
  <div class="loading-note" id="loadingNote">Chargement des séances…</div>

  <div class="event-editor" id="eventEditor" hidden>
    <span class="editor-title-label" id="editorLabel">Nouvelle séance</span>
    <input type="text" id="editorTitle" placeholder="Titre de la séance" autocomplete="off" />
    <div class="editor-start" id="editorStart"></div>
    <span class="palette-label">Étiquette couleur</span>
    <div class="palette" id="palette"></div>
    <div class="editor-error" id="editorError" hidden></div>
    <div class="editor-actions">
      <button type="button" id="editorSave">Enregistrer</button>
      <button type="button" id="editorDelete" hidden>Supprimer</button>
      <button type="button" id="editorCancel">Annuler</button>
    </div>
  </div>

  <div id="calendar"></div>
  <div class="toast" id="toast"></div>

  <script src="config.local.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@5.10.1/main.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/compute.js"></script>
  <script src="js/db.js"></script>
  <script>
    let calendar = null;
    let editingId = null;
    let pendingStart = null;
    let selectedCouleur = '#3B82F6';

    const PALETTE = [
      { hex: '#3B82F6', nom: 'Bleu' },
      { hex: '#4ADE80', nom: 'Vert' },
      { hex: '#FBBF24', nom: 'Jaune' },
      { hex: '#F97316', nom: 'Orange' },
      { hex: '#F87171', nom: 'Rouge' },
      { hex: '#A78BFA', nom: 'Violet' }
    ];
    const DEFAULT_COULEUR = '#3B82F6';

    const editorEl = document.getElementById('eventEditor');
    const editorTitle = document.getElementById('editorTitle');
    const editorStart = document.getElementById('editorStart');
    const editorError = document.getElementById('editorError');
    const editorDelete = document.getElementById('editorDelete');
    const editorLabel = document.getElementById('editorLabel');
    const paletteEl = document.getElementById('palette');

    function showToast(message, type) {
      const t = document.getElementById('toast');
      t.textContent = message;
      t.className = 'toast show' + (type === 'error' ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function eventTextColor(hex) {
      return hex.toUpperCase() === '#FBBF24' ? '#1A1A1A' : '#FFFFFF';
    }

    function buildPalette() {
      paletteEl.innerHTML = PALETTE.map((c) =>
        `<button type="button" class="swatch${c.hex === selectedCouleur ? ' sel' : ''}" data-hex="${c.hex}" title="${c.nom}" style="background:${c.hex}"></button>`
      ).join('');
    }

    paletteEl.addEventListener('click', (e) => {
      const sw = e.target.closest('.swatch');
      if (!sw) return;
      selectedCouleur = sw.dataset.hex;
      buildPalette();
    });

    function fmtDate(value) {
      try {
        return new Date(value).toLocaleString('fr-FR', {
          weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'
        });
      } catch (e) { return String(value); }
    }

    function openEditor(options) {
      editingId = options.id || null;
      pendingStart = options.start || null;
      selectedCouleur = options.couleur || DEFAULT_COULEUR;
      buildPalette();
      editorTitle.value = options.title || '';
      editorLabel.textContent = options.id ? 'Modifier la séance' : 'Nouvelle séance';
      editorStart.textContent = options.start ? 'Début : ' + fmtDate(options.start) : '';
      editorError.hidden = true;
      editorDelete.hidden = !options.id;
      editorEl.hidden = false;
      editorTitle.focus();
    }

    function closeEditor() {
      editorEl.hidden = true;
      editingId = null;
      pendingStart = null;
    }

    function isAuthRedirect(error) {
      return !!(error && error.redirecting);
    }

    async function refreshEvents() {
      const note = document.getElementById('loadingNote');
      try {
        const rows = await getSessions();
        if (!calendar) return;
        calendar.removeAllEvents();
        rows.forEach((r) => calendar.addEvent(toFcEvent(r)));
        note.textContent = rows.length ? '' : 'Aucune séance enregistrée — cliquez sur le planning pour en créer une.';
      } catch (error) {
        console.error(error);
        note.textContent = '';
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur lors du chargement.', 'error');
      }
    }

    function toFcEvent(row) {
      const c = row.couleur || DEFAULT_COULEUR;
      return {
        id: row.id,
        title: row.titre,
        start: row.debut,
        end: row.fin,
        backgroundColor: c,
        borderColor: c,
        textColor: eventTextColor(c)
      };
    }

    function handleDateClick(info) {
      openEditor({ start: info.dateStr });
    }

    function handleEventClick(info) {
      openEditor({
        id: info.event.id,
        title: info.event.title,
        start: info.event.start ? info.event.start.toISOString() : null,
        couleur: info.event.backgroundColor
      });
    }

    async function handleEventDrop(info) { await persistTiming(info); }
    async function handleEventResize(info) { await persistTiming(info); }

    async function persistTiming(info) {
      try {
        await updateSession(info.event.id, {
          debut: info.event.start.toISOString(),
          fin: info.event.end ? info.event.end.toISOString() : null
        });
        showToast('Horaires mis à jour.', 'ok');
      } catch (error) {
        console.error(error);
        info.revert();
        if (!isAuthRedirect(error)) showToast('Erreur — horaires non enregistrés.', 'error');
      }
    }

    async function saveEditor() {
      const titre = editorTitle.value.trim();
      if (!titre) {
        editorError.textContent = 'Le titre est obligatoire.';
        editorError.hidden = false;
        return;
      }

      const saveBtn = document.getElementById('editorSave');
      saveBtn.disabled = true;

      try {
        if (editingId) {
          await updateSession(editingId, { titre, couleur: selectedCouleur });
          const ev = calendar.getEventById(editingId);
          if (ev) {
            ev.setProp('title', titre);
            ev.setProp('backgroundColor', selectedCouleur);
            ev.setProp('borderColor', selectedCouleur);
            ev.setProp('textColor', eventTextColor(selectedCouleur));
          }
          showToast('Séance modifiée.', 'ok');
        } else {
          let debutIso = pendingStart;
          if (debutIso && /^\d{4}-\d{2}-\d{2}$/.test(debutIso)) debutIso += 'T08:00:00';
          if (!debutIso) debutIso = new Date().toISOString();
          const debut = new Date(debutIso);
          const fin = new Date(debut.getTime() + 60 * 60 * 1000).toISOString();
          const row = await addSession({ titre, debut: debut.toISOString(), fin, couleur: selectedCouleur });
          calendar.addEvent(toFcEvent(row));
          document.getElementById('loadingNote').textContent = '';
          showToast('Séance ajoutée.', 'ok');
        }
        closeEditor();
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteEditing() {
      if (!editingId) return;
      const id = editingId;
      try {
        await deleteSessionRow(id);
        const ev = calendar.getEventById(id);
        if (ev) ev.remove();
        closeEditor();
        showToast('Séance supprimée.', 'ok');
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      }
    }

    async function quickAdd() {
      const input = document.getElementById('quickTitle');
      const titre = input.value.trim();
      if (!titre) { input.focus(); return; }
      try {
        const now = new Date();
        now.setMinutes(0, 0, 0);
        const fin = new Date(now.getTime() + 60 * 60 * 1000).toISOString();
        const row = await addSession({ titre, debut: now.toISOString(), fin, couleur: DEFAULT_COULEUR });
        calendar.addEvent(toFcEvent(row));
        document.getElementById('loadingNote').textContent = '';
        input.value = '';
        showToast('Séance ajoutée.', 'ok');
      } catch (error) {
        console.error(error);
        if (!isAuthRedirect(error)) showToast(error.message || 'Erreur — réessayez.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      try {
        initSupabase();
      } catch (error) {
        console.error(error);
        window.location.href = 'index.html';
        return;
      }

      const session = await getSession();
      if (!session) { window.location.href = 'index.html'; return; }

      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        editable: true,
        locale: 'fr',
        firstDay: 1,
        slotMinTime: '06:00:00',
        slotMaxTime: '22:00:00',
        slotDuration: '00:30:00',
        slotLabelInterval: '01:00',
        slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'timeGridWeek,timeGridDay,dayGridMonth'
        },
        allDaySlot: false,
        events: [],
        eventClick: handleEventClick,
        dateClick: handleDateClick,
        eventDrop: handleEventDrop,
        eventResize: handleEventResize
      });
      calendar.render();

      document.getElementById('editorSave').addEventListener('click', saveEditor);
      document.getElementById('editorDelete').addEventListener('click', deleteEditing);
      document.getElementById('editorCancel').addEventListener('click', closeEditor);
      editorTitle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEditor();
        if (e.key === 'Escape') closeEditor();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !editorEl.hidden) closeEditor();
      });

      await refreshEvents();
    });
  </script>
</body>
</html>
